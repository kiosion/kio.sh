global
  log stdout format raw local0
  user haproxy
  group haproxy
  maxconn 64

defaults
  mode tcp
  log global
  option tcplog
  timeout connect 5s
  timeout client 2h
  timeout server 2h

frontend ssh_public
  bind 0.0.0.0:2222 accept-proxy
  stick-table type ip size 10k expire 2h store conn_cur
  tcp-request connection track-sc0 src
  tcp-request connection reject if { sc_conn_cur(0) gt 3 }
  default_backend ssh_server

frontend ssh_direct
  bind 0.0.0.0:2224
  default_backend ssh_server

backend ssh_server
  server sshd 127.0.0.1:2223
